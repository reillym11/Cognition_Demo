[project]
name = "itp-backend"
version = "0.1.0"
description = "Internal tools platform: shared foundation + tools (prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "authlib>=1.3.2",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "faker>=30",
  "pdfplumber>=0.11",
  "pypdf>=5.1",
  "reportlab>=4.2",
  "python-multipart>=0.0.12",
  "honcho>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest-playwright>=0.5",
  "axe-playwright-python>=0.1.4",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mocks"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "S311", "RUF012", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
addopts = "-q -p no:cacheprovider"
markers = ["e2e: browser tests (run via make e2e)"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
